<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Explorador de Provas — Dogmas da Lógica</title>
  <!-- Favicon Icon -->
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- D3.js -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            abbey: {
              50: '#f4f1ea',
              100: '#eae5d9',
              200: '#d4ccb8',
              600: '#2d4a3e',
              700: '#1c3329',
              900: '#1a2421',
            }
          },
          fontFamily: {
            cinzel: ['Cinzel', 'serif'],
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    html, body { height: 100%; background: #f4f1ea url('assets/sacred_pattern_bg.png') repeat fixed; background-size: 400px 400px; color: #1a2421; font-family: 'Inter', sans-serif; }
    h1, h2, h3, .font-cinzel { font-family: 'Cinzel', serif; }
    
    /* D3 Node Styles */
    .node circle { fill: #2d4a3e; stroke: #f4f1ea; stroke-width: 2px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.08)); transition: all 0.25s; }
    .node:hover circle { r: 9; stroke: #1a2421; stroke-width: 2px; cursor: pointer; }
    .node text { font-size: 11px; font-weight: 600; fill: #1a2421; pointer-events: none; font-family: 'Inter', sans-serif; }
    .link { stroke: #d4ccb8; stroke-width: 2px; }
    .node-support circle { fill: #15803d; }
    .node-objecao circle { fill: #b91c1c; }
    .node-resolucao circle { fill: #047857; }
    .node-raiz circle { fill: #1c3329; }
    
    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #d4ccb8; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #2d4a3e; }

    /* Category Accordion */
    .category-header { cursor: pointer; user-select: none; }
    .category-header:hover { background-color: #dfd8c7; }
    .category-content { display: none; }
    .category-content.open { display: block; animation: slideDown 0.25s ease-out; }
    .chevron { transition: transform 0.25s ease; }
    .open .chevron { transform: rotate(180deg); }
    
    @keyframes slideDown {
        from { opacity: 0; transform: translateY(-4px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Controls */
    .view-toggle { display: inline-flex; background: #dfd8c7; border-radius: 10px; padding: 3px; border: 1px solid #d4ccb8; }
    .view-toggle button { padding: 5px 10px; font-size: 11px; font-weight: 600; color: #52635c; border-radius: 7px; transition: all 0.2s; white-space: nowrap; }
    @media (min-width: 640px) {
        .view-toggle button { padding: 6px 14px; font-size: 13px; }
    }
    .view-toggle button.active { background: #2d4a3e; color: #ffffff; }
  </style>
</head>
<body class="h-full flex flex-col md:flex-row antialiased overflow-hidden">
  
  <!-- Sidebar Mobile Overlay backdrop -->
  <div id="sidebar-backdrop" class="fixed inset-0 bg-stone-900/50 backdrop-blur-xs z-40 hidden md:hidden"></div>

  <!-- Sidebar Drawer -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-80 lg:w-96 bg-[#eae5d9] border-r border-[#d4ccb8] flex flex-col shadow-lg md:shadow-none transform -translate-x-full md:translate-x-0 md:static transition-transform duration-300 ease-in-out shrink-0 h-full">
    <div class="p-5 border-b border-[#d4ccb8] space-y-3">
      <div class="flex items-center justify-between">
        <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-bold text-[#2d4a3e] hover:text-[#1c3329] transition-colors">
          <span>←</span> Página Principal
        </a>
        <button id="mobile-close-btn" class="md:hidden p-1 rounded-lg bg-[#dfd8c7] text-[#1a2421]">
          ✕
        </button>
      </div>
      <div>
        <h1 class="text-xl sm:text-2xl font-bold font-cinzel text-[#1a2421] tracking-tight">Árvore de Provas</h1>
        <p class="text-[11px] text-[#2d4a3e] font-bold tracking-wide uppercase">Fides et Ratio Computatrum</p>
      </div>
      
      <div class="mt-2 relative">
        <svg class="w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 text-[#52635c]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        <input type="text" id="search-dogma" placeholder="Buscar dogmas..." class="w-full pl-9 pr-4 py-2 bg-[#f4f1ea] border border-[#d4ccb8] rounded-xl text-xs font-medium text-[#1a2421] placeholder-[#52635c] focus:outline-none focus:border-[#2d4a3e] transition-all">
      </div>

      <button id="btn-open-global-graph" class="w-full mt-2.5 py-2 px-3 rounded-xl bg-[#2d4a3e] text-white hover:bg-[#1c3329] transition-all text-xs font-semibold flex items-center justify-center gap-2 shadow-xs">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
        <span>Grafo Geral (Obsidian)</span>
      </button>
    </div>
    
    <!-- Categorized List -->
    <div id="dogma-list-container" class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-2">
        <!-- Categories injected here -->
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col relative bg-[#f4f1ea] min-w-0 h-full">
    
    <!-- Top Header Bar -->
    <header class="h-16 sm:h-20 px-4 sm:px-8 flex items-center justify-between border-b border-[#d4ccb8] bg-[#eae5d9]/80 backdrop-blur-md z-10 shrink-0 gap-2">
      <div class="flex items-center gap-2.5 min-w-0">
        <!-- Mobile Menu Toggle Button -->
        <button id="mobile-menu-btn" class="md:hidden p-2 rounded-lg bg-[#dfd8c7] text-[#1a2421] hover:bg-[#d4ccb8] focus:outline-none shrink-0" aria-label="Abrir Menu">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
        <h2 id="selected-title" class="text-sm sm:text-lg font-bold font-cinzel text-[#1a2421] truncate max-w-[140px] sm:max-w-xs md:max-w-none">Selecione um dogma na lista</h2>
      </div>

      <div class="view-toggle shrink-0" id="toggle-container" style="display: inline-flex;">
        <button id="view-text" class="active">Dossiê Epistêmico</button>
        <button id="view-tree">Árvore (D3)</button>
        <button id="view-global">Grafo Geral</button>
      </div>
    </header>

    <!-- Content Area -->
    <div class="flex-1 overflow-hidden relative">
      
      <!-- Welcome State -->
      <div id="welcome-state" class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 space-y-3 sm:space-y-4">
        <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-[#dfd8c7] border border-[#d4ccb8] flex items-center justify-center text-[#2d4a3e] shadow-xs">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
        </div>
        <h2 class="text-xl sm:text-2xl font-bold font-cinzel text-[#1a2421]">Explorador Doutrinário & Provas Lógicas</h2>
        <p class="text-xs sm:text-sm text-[#52635c] max-w-md leading-relaxed">
          Selecione um dogma no painel lateral para abrir seu <strong>Dossiê Epistêmico</strong> ou explore o <strong>Grafo Geral Doutrinário</strong> para visualizar a conexão entre dogmas e preceitos.
        </p>
        <div class="pt-2 flex flex-wrap items-center justify-center gap-3">
          <button id="welcome-global-btn" class="px-5 py-2.5 rounded-xl bg-[#2d4a3e] text-white font-semibold text-xs hover:bg-[#1c3329] transition-all flex items-center gap-2 shadow-xs">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
            <span>Ver Grafo Geral (Obsidian)</span>
          </button>
        </div>
      </div>

      <!-- Tree Container -->
      <div id="tree-container" class="absolute inset-0 hidden"></div>
      
      <!-- Text Container (Dossiê Epistêmico) -->
      <div id="text-container" class="absolute inset-0 hidden overflow-y-auto custom-scrollbar p-4 sm:p-8 lg:p-12"></div>

      <!-- Global Graph Container -->
      <div id="global-graph-container" class="absolute inset-0 hidden flex flex-col"></div>
    </div>

  </main>

  <script>
    const CATEGORIAS_MAP = {
        "Sobre Deus": [
            "A Existencia de Deus (conhecivel pela razao)", "A Existencia de Deus como Objeto de Fe", "A Unidade de Deus", "Deus e Eterno", "A Santissima Trindade"
        ],
        "Sobre Jesus Cristo": [
            "Jesus Cristo e verdadeiro Deus e Filho de Deus por Essencia", "Jesus possui duas naturezas (divina e humana) sem confusao", "Cada natureza em Cristo possui uma vontade e operacao proprias", "Jesus Cristo e o Filho Natural de Deus", "O sacrificio de Cristo na Cruz foi um verdadeiro sacrificio", "Cristo redimiu e reconciliou a humanidade com Deus", "Cristo ressuscitou dos mortos ao terceiro dia", "Cristo ascendeu em Corpo e Alma aos Ceus"
        ],
        "Sobre a Criação": [
            "Tudo o que existe foi criado por Deus a partir do Nada (ex nihilo)", "O mundo teve um inicio no tempo", "Deus conserva todas as coisas criadas na existencia"
        ],
        "Sobre o Ser Humano": [
            "O ser humano e composto de corpo material e alma espiritual", "O pecado de Adao propaga-se por geracao (Pecado Original)", "O homem caido nao pode redimir-se a si mesmo"
        ],
        "Dogmas Marianos": [
            "A Maternidade Divina de Maria (Theotokos)", "A Virgindade Perpetua de Maria", "A Imaculada Conceicao de Maria", "A Assuncao de Maria em Corpo e Alma"
        ],
        "Sobre o Papa e a Igreja": [
            "A Igreja foi fundada por Jesus Cristo", "Cristo conferiu a Pedro o primado de jurisdicao sobre toda a Igreja", "O Papa possui poder de jurisdicao pleno e supremo sobre a Igreja", "O Papa e infalivel quando fala ex cathedra", "A Igreja e infalivel ao definir materia de fe e costumes"
        ],
        "Sobre os Sacramentos": [
            "O Batismo e um verdadeiro Sacramento instituido por Cristo", "A Confirmacao e um verdadeiro Sacramento", "A Igreja tem o poder de perdoar os pecados cometidos apos o Batismo", "A Confissao Sacramental e de direito divino e necessaria para a salvacao", "A Eucaristia e um verdadeiro Sacramento instituido por Cristo", "A Presenca Real de Cristo na Eucaristia pela Transubstanciacao", "A Uncao dos Enfermos e um verdadeiro Sacramento", "A Ordem e um verdadeiro Sacramento", "O Matrimonio e um verdadeiro Sacramento"
        ],
        "Sobre as Últimas Coisas": [
            "A Morte e consequencia do pecado", "O Ceu (visao beatifica) e o destino dos justos", "O Inferno existe e e eterno", "O Purgatorio existe como estado de purificacao", "No fim do mundo, Cristo voltara para julgar", "A Ressurreicao dos mortos no Ultimo Dia", "Havera um Juizo Universal"
        ]
    };

    let currentProof = null;
    let currentView = 'text';
    let allDogmas = [];
    let globalGraphData = null;
    let globalSimulation = null;
    let activeFilters = {
        dogma: true,
        revelacao: true,
        pressuposto: true,
        magisterio: true,
        objecao: true
    };

    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const mobileCloseBtn = document.getElementById('mobile-close-btn');
    const sidebar = document.getElementById('sidebar');
    const sidebarBackdrop = document.getElementById('sidebar-backdrop');

    function toggleMobileMenu() {
        const isOpen = !sidebar.classList.contains('-translate-x-full');
        if (isOpen) {
            sidebar.classList.add('-translate-x-full');
            sidebarBackdrop.classList.add('hidden');
        } else {
            sidebar.classList.remove('-translate-x-full');
            sidebarBackdrop.classList.remove('hidden');
        }
    }

    if (mobileMenuBtn) mobileMenuBtn.addEventListener('click', toggleMobileMenu);
    if (mobileCloseBtn) mobileCloseBtn.addEventListener('click', toggleMobileMenu);
    if (sidebarBackdrop) sidebarBackdrop.addEventListener('click', toggleMobileMenu);

    const categoryLookup = {};
    Object.keys(CATEGORIAS_MAP).forEach(cat => {
        CATEGORIAS_MAP[cat].forEach(dogmaName => {
            categoryLookup[dogmaName] = cat;
        });
    });

    async function loadIndex(){
      try {
        const res = await fetch('data/proofs/index.json');
        if(!res.ok) throw new Error('Não foi possível carregar index.json');
        allDogmas = await res.json();
        renderCategories(allDogmas);

        // Suporte a Deeplinking via URL Hash (ex: #trindade ou ?dogma=trindade)
        checkUrlRoute();
      } catch (e) {
        document.getElementById('dogma-list-container').innerHTML = `<p class="text-red-700 text-xs p-4">Erro ao carregar o índice de dogmas: ${e.message}</p>`;
      }
    }

    function renderCategories(dogmas) {
      const container = document.getElementById('dogma-list-container');
      container.innerHTML = '';
      
      const categorized = {};
      
      dogmas.forEach(d => {
          const cat = categoryLookup[d.nome] || 'Outros Dogmas';
          if (!categorized[cat]) categorized[cat] = [];
          categorized[cat].push(d);
      });

      const order = [...Object.keys(CATEGORIAS_MAP), 'Outros Dogmas'];
      
      order.forEach(catName => {
          if (!categorized[catName] || categorized[catName].length === 0) return;
          
          const catDiv = document.createElement('div');
          catDiv.className = 'rounded-xl bg-[#eae5d9] border border-[#d4ccb8] overflow-hidden';
          
          const header = document.createElement('div');
          header.className = 'category-header flex items-center justify-between p-2.5 sm:p-3 bg-[#eae5d9] hover:bg-[#dfd8c7] transition-colors border-b border-transparent';
          header.innerHTML = `
            <span class="font-bold text-xs font-cinzel text-[#1a2421] flex items-center gap-1.5"><span class="text-[#2d4a3e]">✦</span> ${catName}</span>
            <svg class="chevron w-4 h-4 text-[#2d4a3e]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          `;
          
          const content = document.createElement('div');
          content.className = 'category-content bg-[#f4f1ea]/70 p-1 space-y-0.5';
          
          categorized[catName].forEach(d => {
              const btn = document.createElement('button');
              btn.className = 'w-full text-left px-3 py-2 text-xs text-[#3a4742] rounded-lg hover:bg-[#dfd8c7] hover:text-[#1a2421] transition-colors dogma-item truncate';
              btn.textContent = d.nome || d.id;
              btn.dataset.id = d.id;
              btn.dataset.name = d.nome || d.id;
              btn.onclick = () => {
                  document.querySelectorAll('.dogma-item').forEach(b => b.classList.remove('bg-[#dfd8c7]', 'font-bold', 'text-[#1a2421]'));
                  btn.classList.add('bg-[#dfd8c7]', 'font-bold', 'text-[#1a2421]');
                  loadProof(d.id, d.nome || d.id);
                  if (window.innerWidth < 768) toggleMobileMenu();
              };
              content.appendChild(btn);
          });
          
          header.onclick = () => {
              const isOpen = content.classList.contains('open');
              if (!isOpen) {
                  content.classList.add('open');
                  header.classList.add('border-[#d4ccb8]');
              } else {
                  content.classList.remove('open');
                  header.classList.remove('border-[#d4ccb8]');
              }
          };
          
          catDiv.appendChild(header);
          catDiv.appendChild(content);
          container.appendChild(catDiv);
      });
    }

    function checkUrlRoute() {
        const urlParams = new URLSearchParams(window.location.search);
        const paramDogma = urlParams.get('dogma');
        const hashDogma = window.location.hash.replace('#', '');
        const targetId = paramDogma || hashDogma;

        if (targetId === 'global') {
            showView('global');
            return;
        }

        if (targetId && allDogmas.length > 0) {
            const found = allDogmas.find(d => d.id === targetId);
            if (found) {
                const btn = document.querySelector(`.dogma-item[data-id="${found.id}"]`);
                if (btn) {
                    const content = btn.parentElement;
                    const header = content.previousElementSibling;
                    content.classList.add('open');
                    if (header) header.classList.add('border-[#d4ccb8]');
                    btn.click();
                }
            }
        }
    }

    window.addEventListener('hashchange', checkUrlRoute);

    async function loadProof(id, nome){
      document.getElementById('welcome-state').style.display = 'none';
      document.getElementById('toggle-container').style.display = 'inline-flex';
      
      // Atualizar URL hash sem recarregar para permitir compartilhamento direto
      if (window.location.hash !== `#${id}`) {
          history.pushState(null, '', `#${id}`);
      }
      
      const res = await fetch(`data/proofs/${id}.json`);
      const textContainer = document.getElementById('text-container');
      const title = document.getElementById('selected-title');
      
      if(!res.ok){ 
          textContainer.innerHTML = '<div class="text-red-700 font-semibold p-4 text-xs sm:text-sm">Erro: Prova lógica não encontrada ou não gerada no servidor.</div>'; 
          title.textContent = nome; 
          showView('text');
          return; 
      }
      
      const data = await res.json();
      currentProof = data;
      title.textContent = data.nome || id;
      
      showView(currentView === 'global' ? 'text' : currentView);
    }

    function showView(view) {
        currentView = view;
        const treeContainer = document.getElementById('tree-container');
        const textContainer = document.getElementById('text-container');
        const globalGraphContainer = document.getElementById('global-graph-container');
        const welcomeState = document.getElementById('welcome-state');
        const title = document.getElementById('selected-title');
        
        document.getElementById('view-text').classList.remove('active');
        document.getElementById('view-tree').classList.remove('active');
        document.getElementById('view-global').classList.remove('active');
        
        treeContainer.classList.add('hidden');
        textContainer.classList.add('hidden');
        globalGraphContainer.classList.add('hidden');
        
        if (view === 'tree') {
            document.getElementById('view-tree').classList.add('active');
            treeContainer.classList.remove('hidden');
            if (welcomeState && currentProof) welcomeState.style.display = 'none';
            if (currentProof) renderTree(currentProof, treeContainer);
        } else if (view === 'global') {
            document.getElementById('view-global').classList.add('active');
            globalGraphContainer.classList.remove('hidden');
            if (welcomeState) welcomeState.style.display = 'none';
            title.textContent = 'Grafo Geral da Doutrina (Obsidian View)';
            renderGlobalGraph(globalGraphContainer);
        } else { // 'text' (Dossiê Epistêmico - default)
            document.getElementById('view-text').classList.add('active');
            textContainer.classList.remove('hidden');
            if (welcomeState && currentProof) welcomeState.style.display = 'none';
            if (currentProof) {
                title.textContent = currentProof.nome || currentProof.dogma;
                textContainer.innerHTML = renderProofText(currentProof);
            }
        }
    }

    function vereditoLabel(veredito){
      const labels = {
        solido: 'Sólido',
        objecao_nao_resolvida: 'Em disputa',
        sem_fundamento: 'Sem fundamento modelado',
        nao_modelado: 'Não modelado',
        incompleto: 'Incompleto',
        definicao_magisterial_presente: 'Definição presente',
        definicao_magisterial_resistente: 'Resistente nos dados',
        conflito_nos_dados: 'Conflito nos dados'
      };
      return labels[veredito] || String(veredito || 'indefinido').replace(/_/g, ' ');
    }

    function vereditoClass(veredito){
      if(veredito === 'definicao_magisterial_resistente' || veredito === 'solido') return 'bg-emerald-100 text-emerald-900 border-emerald-300';
      if(veredito === 'definicao_magisterial_presente') return 'bg-[#dfd8c7] text-[#2d4a3e] border-[#d4ccb8]';
      if(veredito === 'conflito_nos_dados' || veredito === 'objecao_nao_resolvida') return 'bg-rose-100 text-rose-900 border-rose-300';
      return 'bg-amber-100 text-amber-900 border-amber-300';
    }

    function renderProofText(data){
      let html = `
        <div class="max-w-4xl mx-auto bg-[#eae5d9] rounded-2xl shadow-sm border border-[#d4ccb8] overflow-hidden mb-12">
          
          <div class="p-4 sm:p-8 border-b border-[#d4ccb8] bg-[#f4f1ea]">
             <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3 mb-2">
                 <div>
                     <span class="text-[10px] font-mono font-bold uppercase tracking-wider text-[#2d4a3e] bg-[#dfd8c7] px-2.5 py-0.5 rounded border border-[#d4ccb8] mb-1 inline-block">Dossiê Epistêmico</span>
                     <h2 class="text-xl sm:text-3xl font-bold font-cinzel text-[#1a2421] leading-tight">${data.nome || data.dogma}</h2>
                 </div>
                 <span class="px-3 py-1 rounded-full text-[11px] sm:text-xs font-bold uppercase tracking-wider border shrink-0 self-start ${vereditoClass(data.veredito)}">
                    ${vereditoLabel(data.veredito)}
                 </span>
             </div>
             <p class="text-xs sm:text-base text-[#3a4742] leading-relaxed mt-2 sm:mt-3">${data.significado || 'Nenhuma definição teológica adicional registrada.'}</p>
          </div>
      `;

    function renderTree(data, container){
      container.innerHTML = '';
      
      const width = container.clientWidth;
      const height = container.clientHeight;
      if (width === 0 || height === 0) return;

      const margin = { top: 35, right: 20, bottom: 35, left: 20 };

      const svg = d3.select(container).append('svg')
          .attr('width', '100%')
          .attr('height', '100%')
          .attr('viewBox', [0, 0, width, height]);

      const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);
      svg.call(d3.zoom().on('zoom', (event) => {
         g.attr('transform', event.transform);
      }));

      const treeData = buildTreeData(data);
      const tree = d3.tree().size([width - margin.left - margin.right, height - margin.top - margin.bottom - 80]);
      const root = d3.hierarchy(treeData);
      tree(root);

      const linkGenerator = d3.linkVertical()
          .x(d => d.x)
          .y(d => d.y);

      g.selectAll('.link')
        .data(root.links())
        .enter().append('path')
        .attr('class', 'link')
        .attr('fill', 'none')
        .attr('d', linkGenerator);

      const nodes = g.selectAll('.node')
        .data(root.descendants())
        .enter().append('g')
        .attr('class', d => {
          let cls = 'node';
          if(d.data.type === 'raiz') cls += ' node-raiz';
          else if(d.data.type === 'support') cls += ' node-support';
          else if(d.data.type === 'objection') cls += ' node-objecao';
          else if(d.data.type === 'resolution') cls += ' node-resolucao';
          return cls;
        })
        .attr('transform', d => `translate(${d.x},${d.y})`);

      nodes.append('circle').attr('r', 7);
      
      nodes.append('text')
        .attr('dy', d => d.children ? -12 : 20)
        .attr('text-anchor', 'middle')
        .text(d => d.data.label);

      const tooltipDiv = d3.select('body').append('div')
        .attr('class', 'absolute hidden bg-[#eae5d9] border border-[#d4ccb8] p-3 rounded-xl shadow-lg max-w-xs z-50 text-xs text-[#1a2421] pointer-events-none transition-opacity duration-200');

      nodes.on('mouseover', function(e, d){
        if(d.data.tooltip){
          tooltipDiv.classed('hidden', false)
            .html(`<strong>${d.data.label}</strong><br/><span class="text-[#52635c] mt-1 block">${d.data.tooltip}</span>`)
            .style('left', (e.pageX + 15) + 'px')
            .style('top', (e.pageY - 15) + 'px');
        }
      }).on('mousemove', function(e){
          tooltipDiv.style('left', (e.pageX + 15) + 'px').style('top', (e.pageY - 15) + 'px');
      }).on('mouseout', function(){
        tooltipDiv.classed('hidden', true);
      });
    }

    function buildTreeData(proof){
      const root = {
        label: proof.nome ? proof.nome.substring(0, 18) + '...' : proof.dogma,
        type: 'raiz',
        tooltip: `Dogma Central: ${proof.nome || proof.dogma}`,
        children: []
      };

      if(proof.definicao_dogmatica && Object.keys(proof.definicao_dogmatica).length > 0){
        const d = proof.definicao_dogmatica;
        root.children.push({
          label: 'Definição',
          type: 'support',
          tooltip: d.texto || 'Definição magisterial cadastrada.',
          children: [
            {
              label: d.grau ? String(d.grau).replace(/_/g, ' ') : 'grau',
              type: 'support-leaf',
              tooltip: d.conexao_revelacao || ''
            },
            {
              label: d.fonte_aprovada ? 'Fonte aprovada' : 'Fonte pendente',
              type: 'support-leaf',
              tooltip: d.fonte_id || ''
            }
          ]
        });
      }

      if(proof.pressupostos_assentimento && proof.pressupostos_assentimento.length > 0){
        root.children.push({
          label: `Pressupostos (${proof.pressupostos_assentimento.length})`,
          type: 'support',
          tooltip: 'Condições de assentimento.',
          children: proof.pressupostos_assentimento.map(p => ({
            label: p.nivel,
            type: 'support-leaf',
            tooltip: `${p.id}: ${p.proposicao}`
          }))
        });
      }

      if(proof.revelacoes_base && proof.revelacoes_base.length > 0){
        root.children.push({
          label: `Revelações (${proof.revelacoes_base.length})`,
          type: 'support',
          tooltip: 'Verdades reveladas elementares.',
          children: proof.revelacoes_base.map(r => ({
            label: r.tipo,
            type: 'support-leaf',
            tooltip: `${r.id}: ${r.proposicao}`
          }))
        });
      }

      if(proof.sustentacao){
        const s = proof.sustentacao;
        const children = [];
        if(s.axioma && s.axioma !== '') children.push({ label: 'Axioma', type: 'support-leaf', tooltip: s.axioma });
        if(s.biblicos && s.biblicos.length>0) {
            s.biblicos.forEach(b => {
                children.push({ label: 'Escritura', type: 'support-leaf', tooltip: String(b) });
            });
        }
        if(s.documentos && s.documentos.length>0) children.push({ label: `Documentos (${s.documentos.length})`, type: 'support-leaf', tooltip: s.documentos.join(', ') });
        if(s.concilios && s.concilios.length>0) children.push({ label: `Concílios (${s.concilios.length})`, type: 'support-leaf', tooltip: s.concilios.join(', ') });
        
        if(children.length>0){
          root.children.push({ label: 'Fundamentos', type: 'support', tooltip: 'Bases axiomáticas e bíblicas.', children: children });
        }
      }

      if(proof.referencias_magisteriais && proof.referencias_magisteriais.length > 0){
        root.children.push({
          label: `Magistério (${proof.referencias_magisteriais.length})`,
          type: 'support',
          tooltip: 'Referências magisteriais aprovadas.',
          children: proof.referencias_magisteriais.map(ref => ({
            label: ref.titulo ? ref.titulo.substring(0, 14) + '...' : 'Fonte',
            type: 'support-leaf',
            tooltip: `${ref.titulo || ref.id}`
          }))
        });
      }

      if(proof.objecoes && proof.objecoes.length > 0){
        const objNode = {
          label: `Objeções`,
          type: 'objection',
          tooltip: 'Desafios lógicos e heresias.',
          children: proof.objecoes.map(o => ({
            label: o.argumento.replace(/_/g, ' ').substring(0, 14) + '...',
            type: o.resolvida ? 'resolution' : 'objection',
            tooltip: `${o.argumento.replace(/_/g, ' ')} — ${o.resolvida ? '(Resolvida pela Igreja)' : '(Em Disputa)'}`,
            children: o.resolvida && o.resolucao && o.resolucao.texto ? [
              {
                label: 'Resolução',
                type: 'resolution-leaf',
                tooltip: o.resolucao.texto
              }
            ] : []
          }))
        };
        root.children.push(objNode);
      }

      root.children.push({
        label: `Veredito: ${vereditoLabel(proof.veredito)}`,
        type: 'raiz',
        tooltip: `Veredito da modelagem: ${vereditoLabel(proof.veredito)}`
      });

      return root;
    }

        if (globalGraphData) return globalGraphData;
        
        const proofPromises = allDogmas.map(d => 
            fetch(`data/proofs/${d.id}.json`)
                .then(res => res.ok ? res.json() : null)
                .catch(() => null)
        );
        const proofs = await Promise.all(proofPromises);
        
        const nodes = [];
        const links = [];
        const nodeMap = new Map();
        
        function addNode(id, label, type, extra = {}) {
            if (!id) return null;
            const key = `${type}:${id}`;
            if (!nodeMap.has(key)) {
                const node = {
                    id: key,
                    rawId: id,
                    label: label || id,
                    type: type,
                    ...extra
                };
                nodeMap.set(key, node);
                nodes.push(node);
            }
            return nodeMap.get(key);
        }
        
        function addLink(sourceKey, targetKey, relType) {
            if (sourceKey && targetKey && sourceKey !== targetKey) {
                links.push({
                    source: sourceKey,
                    target: targetKey,
                    relType: relType
                });
            }
        }
        
        proofs.forEach((proof, idx) => {
            if (!proof) {
                const item = allDogmas[idx];
                if (item) addNode(item.id, item.nome, 'dogma');
                return;
            }
            
            const dogmaId = proof.dogma || allDogmas[idx]?.id;
            const dogmaNode = addNode(dogmaId, proof.nome || proof.dogma, 'dogma', {
                veredito: proof.veredito,
                significado: proof.significado,
                categoria: categoryLookup[proof.nome] || categoryLookup[proof.dogma] || 'Geral'
            });
            
            if (Array.isArray(proof.pressupostos_assentimento)) {
                proof.pressupostos_assentimento.forEach(p => {
                    const pNode = addNode(p.id, p.proposicao || p.id, 'pressuposto', {
                        nivel: p.nivel,
                        papel: p.papel
                    });
                    if (pNode && dogmaNode) addLink(dogmaNode.id, pNode.id, 'pressupostos');
                });
            }
            
            if (Array.isArray(proof.revelacoes_base)) {
                proof.revelacoes_base.forEach(r => {
                    const rNode = addNode(r.id, r.proposicao || r.id, 'revelacao', {
                        tipo: r.tipo,
                        modo: r.modo,
                        nota: r.nota
                    });
                    if (rNode && dogmaNode) addLink(dogmaNode.id, rNode.id, 'revelacao');
                });
            }
            
            if (Array.isArray(proof.referencias_magisteriais)) {
                proof.referencias_magisteriais.forEach(m => {
                    const magId = m.id || m.titulo;
                    const mNode = addNode(magId, m.titulo || m.id, 'magisterio', {
                        ano: m.ano,
                        autor: m.autor,
                        referencia: m.referencia
                    });
                    if (mNode && dogmaNode) addLink(dogmaNode.id, mNode.id, 'magisterio');
                });
            }
            if (proof.sustentacao && Array.isArray(proof.sustentacao.concilios)) {
                proof.sustentacao.concilios.forEach(c => {
                    const cNode = addNode(c, c, 'magisterio', { tipo: 'concilio' });
                    if (cNode && dogmaNode) addLink(dogmaNode.id, cNode.id, 'concilio');
                });
            }
            
            if (Array.isArray(proof.objecoes)) {
                proof.objecoes.forEach(o => {
                    const objLabel = o.tipo_heresia || o.argumento;
                    const oNode = addNode(objLabel, objLabel, 'objecao', {
                        periodo: o.periodo_heresia,
                        suporte: o.suporte_argumento,
                        resolucao: o.resolucao?.texto
                    });
                    if (oNode && dogmaNode) addLink(dogmaNode.id, oNode.id, 'objecao');
                });
            }
        });
        
        const dogmaNodes = nodes.filter(n => n.type === 'dogma');
        const categoryGroups = {};
        dogmaNodes.forEach(dn => {
            if (!categoryGroups[dn.categoria]) categoryGroups[dn.categoria] = [];
            categoryGroups[dn.categoria].push(dn);
        });
        
        Object.values(categoryGroups).forEach(group => {
            for (let i = 0; i < group.length - 1; i++) {
                addLink(group[i].id, group[i + 1].id, 'inter-dogma');
            }
        });
        
        const specificConnections = [
            ['trindade', 'jesus_deus_essencia'],
            ['trindade', 'unidade_deus'],
            ['jesus_deus_essencia', 'duas_naturezas'],
            ['duas_naturezas', 'maternidade_divina'],
            ['maternidade_divina', 'imaculada_conceicao'],
            ['imaculada_conceicao', 'assuncao_maria'],
            ['imaculada_conceicao', 'pecado_original'],
            ['fundacao_igreja', 'primado_pedro'],
            ['primado_pedro', 'jurisdicao_papa'],
            ['jurisdicao_papa', 'infalibilidade_papa'],
            ['infalibilidade_papa', 'infalibilidade_igreja'],
            ['eucaristia_sacramento', 'presenca_real'],
            ['criacao_ex_nihilo', 'existencia_deus_razao'],
            ['existencia_deus_razao', 'existencia_deus_fe'],
            ['redencao', 'sacrificio_cruz'],
            ['ressurreicao', 'ascensao'],
            ['ascensao', 'volta_cristo'],
            ['volta_cristo', 'juizo_universal'],
            ['juizo_universal', 'ressurreicao_mortos'],
            ['ceu_justos', 'purgatorio_existencia'],
            ['purgatorio_existencia', 'inferno_eterno']
        ];
        
        specificConnections.forEach(([id1, id2]) => {
            const k1 = `dogma:${id1}`;
            const k2 = `dogma:${id2}`;
            if (nodeMap.has(k1) && nodeMap.has(k2)) {
                addLink(k1, k2, 'thematic-dogma');
            }
        });
        
        globalGraphData = { nodes, links };
        return globalGraphData;
    }

    async function renderGlobalGraph(container) {
        container.innerHTML = `
            <div class="flex flex-col h-full relative overflow-hidden bg-[#f4f1ea]">
                <div class="p-3 sm:p-4 bg-[#eae5d9]/90 border-b border-[#d4ccb8] backdrop-blur-md z-10 flex flex-wrap items-center justify-between gap-3 shrink-0">
                    <div class="flex flex-wrap items-center gap-1.5 sm:gap-2 text-[11px] font-semibold">
                        <span class="text-[#52635c] text-xs mr-1 hidden sm:inline font-cinzel">Filtros:</span>
                        <button data-type="dogma" class="filter-chip ${activeFilters.dogma ? 'active-chip bg-emerald-100 border-emerald-300' : 'opacity-40 bg-stone-100 border-stone-300'} flex items-center gap-1.5 px-2.5 py-1 rounded-lg border transition-all text-[#1a2421]">
                            <span class="w-2.5 h-2.5 rounded-full bg-[#2d4a3e]"></span> Dogmas
                        </button>
                        <button data-type="revelacao" class="filter-chip ${activeFilters.revelacao ? 'active-chip bg-rose-100 border-rose-300' : 'opacity-40 bg-stone-100 border-stone-300'} flex items-center gap-1.5 px-2.5 py-1 rounded-lg border transition-all text-[#1a2421]">
                            <span class="w-2.5 h-2.5 rounded-full bg-[#dc2626]"></span> Revelações
                        </button>
                        <button data-type="pressuposto" class="filter-chip ${activeFilters.pressuposto ? 'active-chip bg-amber-100 border-amber-300' : 'opacity-40 bg-stone-100 border-stone-300'} flex items-center gap-1.5 px-2.5 py-1 rounded-lg border transition-all text-[#1a2421]">
                            <span class="w-2.5 h-2.5 rounded-full bg-[#b8860b]"></span> Pressupostos
                        </button>
                        <button data-type="magisterio" class="filter-chip ${activeFilters.magisterio ? 'active-chip bg-purple-100 border-purple-300' : 'opacity-40 bg-stone-100 border-stone-300'} flex items-center gap-1.5 px-2.5 py-1 rounded-lg border transition-all text-[#1a2421]">
                            <span class="w-2.5 h-2.5 rounded-full bg-[#7c3aed]"></span> Magistério
                        </button>
                        <button data-type="objecao" class="filter-chip ${activeFilters.objecao ? 'active-chip bg-stone-200 border-stone-400' : 'opacity-40 bg-stone-100 border-stone-300'} flex items-center gap-1.5 px-2.5 py-1 rounded-lg border transition-all text-[#1a2421]">
                            <span class="w-2.5 h-2.5 rounded-full bg-[#be123c]"></span> Objeções
                        </button>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="text" id="global-graph-search" placeholder="Filtrar nós..." class="px-3 py-1.5 bg-[#f4f1ea] border border-[#d4ccb8] rounded-lg text-xs font-medium text-[#1a2421] placeholder-[#52635c] focus:outline-none focus:border-[#2d4a3e]">
                        <button id="reset-global-zoom" class="px-2.5 py-1.5 rounded-lg bg-[#dfd8c7] border border-[#d4ccb8] text-xs font-semibold text-[#1a2421] hover:bg-[#d4ccb8] transition-colors" title="Centralizar Grafo">
                            🎯 Centralizar
                        </button>
                    </div>
                </div>

                <div id="global-graph-canvas" class="flex-1 w-full h-full relative cursor-grab active:cursor-grabbing"></div>

                <div id="node-inspector" class="absolute bottom-4 right-4 max-w-sm w-full bg-[#eae5d9]/95 backdrop-blur-md border border-[#d4ccb8] p-4 rounded-2xl shadow-xl z-20 text-xs hidden space-y-2">
                    <div class="flex items-center justify-between border-b border-[#d4ccb8] pb-2">
                        <span id="inspector-badge" class="px-2 py-0.5 rounded text-[10px] font-bold uppercase"></span>
                        <button id="close-inspector" class="text-[#52635c] hover:text-[#1a2421]">✕</button>
                    </div>
                    <h4 id="inspector-title" class="font-cinzel text-sm font-bold text-[#1a2421]"></h4>
                    <p id="inspector-desc" class="text-[#3a4742] leading-relaxed"></p>
                    <div id="inspector-action" class="pt-2"></div>
                </div>
            </div>
        `;

        const data = await prepareGlobalGraphData();
        if (!data || !data.nodes.length) return;

        const canvas = document.getElementById('global-graph-canvas');
        const width = canvas.clientWidth || 800;
        const height = canvas.clientHeight || 600;

        let filteredNodes = data.nodes.filter(n => activeFilters[n.type]);
        let filteredNodeIds = new Set(filteredNodes.map(n => n.id));
        let filteredLinks = data.links.filter(l => 
            filteredNodeIds.has(typeof l.source === 'object' ? l.source.id : l.source) &&
            filteredNodeIds.has(typeof l.target === 'object' ? l.target.id : l.target)
        );

        const colorMap = {
            dogma: { fill: '#2d4a3e', stroke: '#10b981', text: '#1a2421', radius: 12 },
            revelacao: { fill: '#dc2626', stroke: '#f87171', text: '#1a2421', radius: 8 },
            pressuposto: { fill: '#b8860b', stroke: '#f59e0b', text: '#1a2421', radius: 8 },
            magisterio: { fill: '#7c3aed', stroke: '#a78bfa', text: '#1a2421', radius: 7 },
            objecao: { fill: '#be123c', stroke: '#fb7185', text: '#1a2421', radius: 7 }
        };

        canvas.innerHTML = '';
        const svg = d3.select(canvas)
            .append('svg')
            .attr('width', '100%')
            .attr('height', '100%')
            .attr('viewBox', `0 0 ${width} ${height}`);

        const g = svg.append('g');

        const zoom = d3.zoom()
            .scaleExtent([0.15, 4])
            .on('zoom', (event) => g.attr('transform', event.transform));

        svg.call(zoom);

        document.getElementById('reset-global-zoom')?.addEventListener('click', () => {
            svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
        });

        const simNodes = JSON.parse(JSON.stringify(filteredNodes));
        const simLinks = JSON.parse(JSON.stringify(filteredLinks));

        if (globalSimulation) globalSimulation.stop();

        globalSimulation = d3.forceSimulation(simNodes)
            .force('link', d3.forceLink(simLinks).id(d => d.id).distance(d => d.relType === 'thematic-dogma' ? 85 : 45))
            .force('charge', d3.forceManyBody().strength(-120))
            .force('collide', d3.forceCollide().radius(d => (colorMap[d.type]?.radius || 8) + 8))
            .force('center', d3.forceCenter(width / 2, height / 2));

        const link = g.append('g')
            .attr('stroke', '#d4ccb8')
            .attr('stroke-opacity', 0.6)
            .selectAll('line')
            .data(simLinks)
            .join('line')
            .attr('stroke-width', d => d.relType === 'thematic-dogma' ? 2 : 1)
            .attr('stroke-dasharray', d => d.relType === 'thematic-dogma' ? 'none' : '3,3');

        const node = g.append('g')
            .selectAll('g')
            .data(simNodes)
            .join('g')
            .attr('class', 'global-node cursor-pointer')
            .call(d3.drag()
                .on('start', dragstarted)
                .on('drag', dragged)
                .on('end', dragended));

        node.append('circle')
            .attr('r', d => colorMap[d.type]?.radius || 8)
            .attr('fill', d => colorMap[d.type]?.fill || '#52635c')
            .attr('stroke', d => colorMap[d.type]?.stroke || '#ffffff')
            .attr('stroke-width', 2)
            .style('filter', 'drop-shadow(0 2px 4px rgba(0,0,0,0.15))')
            .style('transition', 'r 0.2s, stroke-width 0.2s');

        node.append('text')
            .text(d => d.label.length > 22 ? d.label.substring(0, 20) + '...' : d.label)
            .attr('x', d => (colorMap[d.type]?.radius || 8) + 4)
            .attr('y', 4)
            .attr('font-size', d => d.type === 'dogma' ? '11px' : '9px')
            .attr('font-weight', d => d.type === 'dogma' ? 'bold' : 'normal')
            .attr('font-family', d => d.type === 'dogma' ? 'Cinzel, serif' : 'Inter, sans-serif')
            .attr('fill', '#1a2421')
            .style('pointer-events', 'none');

        node.on('mouseover', function(event, d) {
            const connectedNodeIds = new Set();
            connectedNodeIds.add(d.id);

            link.style('stroke-opacity', l => {
                if (l.source.id === d.id || l.target.id === d.id) {
                    connectedNodeIds.add(l.source.id);
                    connectedNodeIds.add(l.target.id);
                    return 1;
                }
                return 0.1;
            }).style('stroke', l => (l.source.id === d.id || l.target.id === d.id) ? '#2d4a3e' : '#d4ccb8')
              .style('stroke-width', l => (l.source.id === d.id || l.target.id === d.id) ? 2.5 : 1);

            node.style('opacity', n => connectedNodeIds.has(n.id) ? 1 : 0.2);
            d3.select(this).select('circle').attr('r', (colorMap[d.type]?.radius || 8) + 4);

            showNodeInspector(d);
        }).on('mouseout', function(event, d) {
            link.style('stroke-opacity', 0.6).style('stroke', '#d4ccb8').style('stroke-width', l => l.relType === 'thematic-dogma' ? 2 : 1);
            node.style('opacity', 1);
            d3.select(this).select('circle').attr('r', colorMap[d.type]?.radius || 8);
        }).on('click', function(event, d) {
            if (d.type === 'dogma') {
                loadProof(d.rawId, d.label);
            }
        });

        globalSimulation.on('tick', () => {
            link
                .attr('x1', d => d.source.x)
                .attr('y1', d => d.source.y)
                .attr('x2', d => d.target.x)
                .attr('y2', d => d.target.y);

            node.attr('transform', d => `translate(${d.x},${d.y})`);
        });

        function dragstarted(event, d) {
            if (!event.active) globalSimulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) globalSimulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }

        document.querySelectorAll('.filter-chip').forEach(btn => {
            btn.onclick = () => {
                const type = btn.getAttribute('data-type');
                activeFilters[type] = !activeFilters[type];
                renderGlobalGraph(document.getElementById('global-graph-container'));
            };
        });

        document.getElementById('global-graph-search')?.addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase();
            if (!query) {
                node.style('opacity', 1);
                link.style('stroke-opacity', 0.6);
                return;
            }
            const matchedIds = new Set();
            simNodes.forEach(n => {
                if (n.label.toLowerCase().includes(query) || (n.significado && n.significado.toLowerCase().includes(query))) {
                    matchedIds.add(n.id);
                }
            });
            node.style('opacity', n => matchedIds.has(n.id) ? 1 : 0.15);
            link.style('stroke-opacity', 0.05);
        });
    }

    function showNodeInspector(d) {
        const inspector = document.getElementById('node-inspector');
        const badge = document.getElementById('inspector-badge');
        const title = document.getElementById('inspector-title');
        const desc = document.getElementById('inspector-desc');
        const action = document.getElementById('inspector-action');
        
        if (!inspector) return;
        
        const typeLabels = {
            dogma: { text: 'Dogma Doutrinário', cls: 'bg-emerald-100 text-emerald-900 border-emerald-300' },
            revelacao: { text: 'Verdade Revelada', cls: 'bg-rose-100 text-rose-900 border-rose-300' },
            pressuposto: { text: 'Pressuposto Epistêmico', cls: 'bg-amber-100 text-amber-900 border-amber-300' },
            magisterio: { text: 'Magistério / Concílio', cls: 'bg-purple-100 text-purple-900 border-purple-300' },
            objecao: { text: 'Heresia / Objeção', cls: 'bg-stone-200 text-stone-900 border-stone-400' }
        };
        
        const meta = typeLabels[d.type] || { text: d.type, cls: 'bg-stone-100 text-stone-800' };
        badge.textContent = meta.text;
        badge.className = `px-2 py-0.5 rounded text-[10px] font-bold uppercase border ${meta.cls}`;
        
        title.textContent = d.label;
        desc.textContent = d.significado || d.nota || d.papel || d.resolucao || (d.type === 'dogma' ? 'Clique para abrir o dossiê epistêmico.' : 'Conexão estrutural na teologia.');
        
        if (d.type === 'dogma') {
            action.innerHTML = `
                <button onclick="loadProof('${d.rawId}', '${d.label.replace(/'/g, "\\'")}')" class="w-full py-1.5 rounded-lg bg-[#2d4a3e] text-white font-semibold text-xs hover:bg-[#1c3329] transition-all">
                    Abrir Dossiê Epistêmico →
                </button>
            `;
        } else {
            action.innerHTML = '';
        }
        
        inspector.classList.remove('hidden');
        document.getElementById('close-inspector').onclick = () => inspector.classList.add('hidden');
    }

    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            if(currentView === 'tree' && currentProof) {
                renderTree(currentProof, document.getElementById('tree-container'));
            } else if (currentView === 'global') {
                renderGlobalGraph(document.getElementById('global-graph-container'));
            }
        }, 150);
    });

    document.getElementById('search-dogma').addEventListener('input', function(e){
      const query = e.target.value.toLowerCase();
      
      document.querySelectorAll('.category-content').forEach(content => {
          let categoryHasMatch = false;
          content.querySelectorAll('.dogma-item').forEach(btn => {
             const text = btn.textContent.toLowerCase();
             if(text.includes(query)) {
                 btn.style.display = 'block';
                 categoryHasMatch = true;
             } else {
                 btn.style.display = 'none';
             }
          });
          
          const header = content.previousElementSibling;
          if(categoryHasMatch) {
              header.style.display = 'flex';
              if(query !== '') {
                  content.classList.add('open');
                  header.classList.add('border-[#d4ccb8]');
              }
          } else {
              header.style.display = 'none';
              content.classList.remove('open');
          }
      });
      
      if(query === '') {
          document.querySelectorAll('.category-content').forEach(c => c.classList.remove('open'));
          document.querySelectorAll('.category-header').forEach(h => {
              h.style.display = 'flex';
              h.classList.remove('border-[#d4ccb8]');
          });
      }
    });

    loadIndex();
  </script>
</body>
</html>
